# Dependency updates. Minor and patch updates are grouped so review noise stays low; security updates
# still open their own pull requests.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Each Expo SDK release pins an exact, tested version of these (`npx expo install --check` lists
      # them). Bumping one alone breaks the build or fails expo-doctor, so they move together, by hand,
      # when the SDK is upgraded with `npx expo install expo@latest --fix`.
      - dependency-name: react-native
      - dependency-name: react
      - dependency-name: react-test-renderer
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-screens
      - dependency-name: react-native-svg
      # The Expo packages and TypeScript are pinned to the SDK's minor version. Patch releases carry
      # real fixes (SDK 57.0.17 fixed a Hermes memory regression), so those are allowed.
      - dependency-name: expo
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: babel-preset-expo
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: jest-expo
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: eslint-config-expo
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Upgraded deliberately with the model-serving work (plan phases P3 and P9); torch and torchvision
      # must move as a matched pair from the CPU index.
      - dependency-name: torch
      - dependency-name: torchvision

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
