name: Frontend CI

on:
  pull_request:
    paths:
      - "src/**"
      - "__tests__/**"
      - "__mocks__/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "babel.config.js"
      - "metro.config.js"
      - "jest.config.js"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Jest tests
        run: npm test -- --ci
