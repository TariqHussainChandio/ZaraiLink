# OSV-Scanner accepted-risk list. CI runs `osv-scanner scan source` over both lockfiles
# (backend/uv.lock and package-lock.json) and FAILS on any advisory not covered here.
#
# Every entry below is a version that is already pinned today and is scheduled for an upgrade in the
# standardization plan. Each has an expiry date: after it, CI fails again until the upgrade lands, so
# accepted risk cannot quietly become permanent. Never add an entry without a reason and a date.
# Baseline recorded 2026-09-21 (phase P1).

# ---- Python (backend/uv.lock): only torch remains (P9 removes it); starlette, python-dotenv, pytest and pillow were resolved by P5's dependency refresh ----

[[PackageOverrides]]
name = "torch"
ecosystem = "PyPI"
ignore = true
effectiveUntil = 2026-11-15T00:00:00Z
reason = "torch 2.6.0 closes CVE-2025-32434 but has later advisories (fixed in 2.7 to 2.9) in operators the API never calls (it only loads a state dict and runs a forward pass on a validated image). Moving to 2.9 or later is a model-runtime change; P9 moves inference to ONNX, which removes torch from the production image."

